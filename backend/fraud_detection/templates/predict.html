<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            width:400px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:blue;
            color:white;
            border:none;
        }

        h2{
            text-align:center;
        }

        .result{
            margin-top:20px;
            padding:10px;
            background:#eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Fraud Detection</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Transaction Amount</label>
        <input type="number" name="amount" required>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <div class="result">
            <strong>Prediction:</strong> {{ result }}
        </div>
    {% endif %}

</div>
</body>
</html>
