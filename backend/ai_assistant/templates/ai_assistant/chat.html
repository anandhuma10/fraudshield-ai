<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FraudShield AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: #0f172a;
            color: white;
        }

        .chat-container{
            max-width: 700px;
            margin: 50px auto;
        }

        .chat-box{
            background: #1e293b;
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 15px;
        }

        .user-message{
            background: #2563eb;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: right;
        }

        .bot-message{
            background: #334155;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .input-area{
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

    </style>

</head>
<body>

<div class="container chat-container">

    <h1 class="text-center mb-4">
        FraudShield AI 🤖
    </h1>

    <div id="chat-box" class="chat-box">

        <div class="bot-message">
            Hello! Ask me about fraud,
            safe, or total transactions.
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            class="form-control"
            placeholder="Type your message..."
        >

        <button
            class="btn btn-primary"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>

<script>

async function sendMessage(){

    const input = document.getElementById(
        'user-input'
    );

    const message = input.value;

    if(message.trim() === ''){
        return;
    }

    const chatBox = document.getElementById(
        'chat-box'
    );

    // User Message

    chatBox.innerHTML += `
        <div class="user-message">
            ${message}
        </div>
    `;

    // Clear Input

    input.value = '';

    // Send to Django API

    const response = await fetch(
        '/ai-assistant/chat/',
        {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                message: message
            })
        }
    );

    const data = await response.json();

    // Bot Reply

    chatBox.innerHTML += `
        <div class="bot-message">
            ${data.reply}
        </div>
    `;

    // Auto Scroll

    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
