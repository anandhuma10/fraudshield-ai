<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            background: #0f172a;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .navbar{
            background: #111827;
        }

        .card-box{
            border-radius: 20px;
            padding: 30px;
            color: white;
            transition: 0.3s;
        }

        .card-box:hover{
            transform: translateY(-5px);
        }

        .total{
            background: linear-gradient(135deg,#3b82f6,#2563eb);
        }

        .fraud{
            background: linear-gradient(135deg,#ef4444,#dc2626);
        }

        .safe{
            background: linear-gradient(135deg,#10b981,#059669);
        }

        h1{
            font-weight: 700;
        }

        .number{
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <h3>FraudShield</h3>
</nav>

<div class="container mt-5">

    <h1 class="mb-4">Fraud Detection Dashboard</h1>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card-box total">
                <h4>Total Transactions</h4>
                <div class="number">{{ total }}</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box fraud">
                <h4>Fraud Transactions</h4>
                <div class="number">{{ fraud }}</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box safe">
                <h4>Safe Transactions</h4>
                <div class="number">{{ safe }}</div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
