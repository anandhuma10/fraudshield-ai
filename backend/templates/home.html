<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body{
            background: #0f172a;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .navbar{
            background: #111827;
        }

        .card-box{
            border-radius: 20px;
            padding: 30px;
            color: white;
            transition: 0.3s;
        }

        .card-box:hover{
            transform: translateY(-5px);
        }

        .total{
            background: linear-gradient(135deg,#3b82f6,#2563eb);
        }

        .fraud{
            background: linear-gradient(135deg,#ef4444,#dc2626);
        }

        .safe{
            background: linear-gradient(135deg,#10b981,#059669);
        }

        h1{
            font-weight: 700;
        }

        .number{
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            FraudShield
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/transactions/">
                        Transactions
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/add/">
                        Add Transaction
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Analytics
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Help
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>
<div class="container mt-5">

    <div class="row g-4 justify-content-center">

        <!-- Total Transactions -->
        <div class="col-md-4">
            <div class="card text-center shadow-lg border-0 rounded-4 p-4 bg-primary text-white">

                <h4>Total Transactions</h4>

                <h1 class="display-4 fw-bold">
                    {{ total }}
                </h1>

            </div>
        </div>

        <!-- Fraud Transactions -->
        <div class="col-md-4">
            <div class="card text-center shadow-lg border-0 rounded-4 p-4 bg-danger text-white">

                <h4>Unsafe Transactions</h4>

                <h1 class="display-4 fw-bold">
                    {{ fraud }}
                </h1>

            </div>
        </div>

        <!-- Safe Transactions -->
        <div class="col-md-4">
            <div class="card text-center shadow-lg border-0 rounded-4 p-4 bg-success text-white">

                <h4>Safe Transactions</h4>

                <h1 class="display-4 fw-bold">
                    {{ safe }}
                </h1>

            </div>
        </div>

    </div>

</div>
